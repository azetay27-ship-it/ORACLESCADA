[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-nilit-scada"
version = "0.1.0"
description = "Oracle, the simulation-first NILIT SCADA/HMI application"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Internal simulation software"}
authors = [{name = "NILIT Oracle Engineering"}]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "asgi-lifespan>=2.1,<3",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]
browser = [
  "playwright>=1.48,<2",
  "pytest-playwright>=0.5,<1",
]
dev = [
  "asgi-lifespan>=2.1,<3",
  "httpx>=0.27,<1",
  "playwright>=1.48,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-playwright>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["oracle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
  "contract: FastAPI contract and role/command tests",
  "browser: optional Playwright browser smoke tests",
  "sse: optional streaming tests that may require a live ASGI server",
  "guardrail: simulation-only and packaging safety checks",
]
